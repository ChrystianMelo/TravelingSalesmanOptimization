[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traveling-salesman-optimization"
version = "0.1.0"
description = "Empirical analysis and optimization of geometric TSP algorithms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["networkx>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
docs = ["code2flow>=2.5,<3", "pylint>=4.1,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["traveling_salesman_optimization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "integration: tests involving multiple components",
  "slow: long-running tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
